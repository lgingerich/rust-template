[package]
name = "rust-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "TODO"
readme = "README.md"
repository = "TODO"
license = "MIT"

[dependencies]

[dev-dependencies]

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
incremental = false
opt-level = 3
lto = true
strip = "debuginfo"

[profile.release-profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev]
codegen-units = 256
debug = 2
debug-assertions = true
incremental = true
opt-level = 0
lto = false
panic = "unwind"
strip = false

[lints.rust]
missing_docs                    = "warn"
missing_debug_implementations   = "warn"
unexpected_cfgs                 = "warn"
unsafe_code                     = "deny"
unsafe_op_in_unsafe_fn          = "deny"
dead_code                       = "warn"
unused_imports                  = "warn"
unused_variables                = "warn"
unused_mut                      = "deny"
unused_assignments              = "deny"
unused_macros                   = "deny"
unused_qualifications           = "deny"
unreachable_pub                 = "deny"
unreachable_code                = "deny"
unreachable_patterns            = "deny"
let_underscore_drop             = "warn"
ambiguous_negative_literals     = "warn"
deprecated_in_future            = "warn"
trivial_casts                   = "warn"
trivial_numeric_casts           = "warn"
unused_lifetimes                = "warn"
redundant_lifetimes             = "warn"
unused_import_braces            = "warn"
unused_macro_rules              = "warn"
redundant_imports               = "warn"
unit_bindings                   = "warn"
impl_trait_redundant_captures   = "warn"
explicit_outlives_requirements  = "warn"
elided_lifetimes_in_paths       = "warn"
unnameable_types                = "warn"

[lints.cargo]
unused_dependencies             = "warn"

[lints.clippy]
pedantic                        = { level = "warn", priority = -2 }

# === Provenance-Safe Pointer Casts ===
borrow_as_ptr                   = "deny"
ptr_as_ptr                      = "deny"
ptr_cast_constness              = "deny"
ref_as_ptr                      = "deny"

# === Soundness ===
as_ptr_cast_mut                 = "deny"
cast_ptr_alignment              = "deny"
drop_non_drop                   = "deny"
mem_forget                      = "deny"
multiple_unsafe_ops_per_block   = "warn"
non_send_fields_in_send_ty      = "warn"
not_unsafe_ptr_arg_deref        = "deny"
trailing_empty_array            = "warn"
transmute_ptr_to_ptr            = "deny"
transmute_undefined_repr        = "warn"
undocumented_unsafe_blocks      = "deny"
uninhabited_references          = "warn"
uninit_vec                      = "deny"
unnecessary_safety_comment      = "warn"
unnecessary_safety_doc          = "warn"

# === Correctness ===
cfg_not_test                    = "warn"
coerce_container_to_any         = "warn"
collection_is_never_read        = "warn"
fallible_impl_from              = "warn"
fn_to_numeric_cast_any          = "warn"
infinite_loop                   = "warn"
lossy_float_literal             = "warn"
map_err_ignore                  = "warn"
mixed_read_write_in_expression  = "warn"
path_buf_push_overwrite         = "warn"
read_zero_byte_vec              = "warn"
significant_drop_in_scrutinee   = "warn"
suspicious_xor_used_as_pow      = "warn"
unused_result_ok                = "warn"
while_float                     = "warn"

# === Performance ===
assigning_clones                = "deny"
clear_with_drain                = "warn"
format_collect                  = "deny"
implicit_clone                  = "deny"
inefficient_to_string           = "deny"
iter_overeager_cloned           = "deny"
iter_with_drain                 = "warn"
large_enum_variant              = "deny"
large_futures                   = "deny"
large_include_file              = "warn"
large_stack_frames              = "deny"
large_types_passed_by_value     = "deny"
manual_memcpy                   = "deny"
map_clone                       = "deny"
needless_collect                = "deny"
needless_pass_by_ref_mut        = "warn"
needless_pass_by_value          = "deny"
or_fun_call                     = "deny"
pathbuf_init_then_push          = "warn"
rc_mutex                        = "warn"
redundant_clone                 = "deny"
set_contains_or_insert          = "warn"
string_lit_chars_any            = "warn"
trivial_regex                   = "warn"
trivially_copy_pass_by_ref      = "deny"
unnecessary_lazy_evaluations    = "deny"
unnecessary_to_owned            = "deny"
vec_init_then_push              = "deny"
verbose_file_reads              = "warn"

# === Clarity ===
allow_attributes                = "warn"
allow_attributes_without_reason = "warn"
arc_with_non_send_sync          = "deny"
as_underscore                   = "warn"
assertions_on_result_states     = "warn"
box_collection                  = "deny"
boxed_local                     = "deny"
clone_on_copy                   = "deny"
clone_on_ref_ptr                = "deny"
dbg_macro                       = "deny"
debug_assert_with_mut_call      = "deny"
derivable_impls                 = "deny"
derive_partial_eq_without_eq    = "deny"
empty_drop                      = "deny"
empty_enum_variants_with_brackets= "warn"
empty_structs_with_brackets     = "warn"
exit                            = "deny"
expect_fun_call                 = "deny"
expect_used                     = "deny"
if_same_then_else               = "deny"
implicit_saturating_sub         = "deny"
manual_c_str_literals           = "deny"
manual_swap                     = "deny"
mem_replace_option_with_none    = "deny"
needless_raw_strings            = "warn"
needless_type_cast              = "warn"
non_zero_suggestions            = "warn"
precedence                      = "deny"
precedence_bits                 = "warn"
print_stderr                    = "warn"
print_stdout                    = "warn"
ptr_eq                          = "deny"
redundant_locals                = "deny"
redundant_type_annotations      = "warn"
renamed_function_params         = "warn"
rest_pat_in_fully_bound_structs = "warn"
shadow_unrelated                = "warn"
single_char_pattern             = "deny"
string_add_assign               = "deny"
tests_outside_test_module       = "warn"
todo                            = "deny"
trait_duplication_in_bounds     = "warn"
try_err                         = "warn"
type_complexity                 = "allow"
type_repetition_in_bounds       = "warn"
unimplemented                   = "deny"
uninlined_format_args           = "deny"
unnecessary_self_imports        = "warn"
unnecessary_struct_initialization= "warn"
unnecessary_unwrap              = "deny"
unused_peekable                 = "deny"
unused_rounding                 = "warn"
unwrap_used                     = "deny"
use_self                        = "warn"
used_underscore_binding         = "deny"
useless_conversion              = "deny"
useless_let_if_seq              = "warn"
vec_box                         = "deny"

# === Cargo.toml Manifest ===
negative_feature_names          = "warn"
redundant_feature_names         = "warn"
wildcard_dependencies           = "warn"
